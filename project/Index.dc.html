<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0D0D0D;color:#C9C9C9;font-family:Manrope,system-ui,sans-serif}*{box-sizing:border-box}a{color:#F5F5F5;text-decoration:none}a:hover{color:#FFFFFF}</style>
</helmet>
<div style="max-width:1100px;margin:0 auto;padding:clamp(32px,6vw,72px) clamp(16px,4vw,40px)">
<div style="font:700 12px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#9A9A9A">DOJO X · UI MOCKUPS</div>
<h1 style="margin:14px 0 40px;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(56px,9vw,120px);line-height:.86;text-transform:uppercase;color:#F5F5F5">Everything<span style="color:#C8102E">.</span></h1>
<div style="display:flex;flex-direction:column;gap:28px">
<sc-for list="{{phases}}" as="p" hint-placeholder-count="5">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;padding-top:20px;border-top:1px solid #262626">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:Anton,Impact,sans-serif;font-size:56px;line-height:.85;color:#C8102E">{{p.n}}</span><span style="font:800 18px/1.2 Manrope,sans-serif;color:#F5F5F5">{{p.title}}</span><a href="{{p.canvas}}" style="font:700 12px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#9A9A9A;text-decoration:underline;text-underline-offset:4px">ALL SCREENS, MOBILE + DESKTOP ↗</a></div>
<div style="grid-column:span 2;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start"><sc-for list="{{p.links}}" as="l" hint-placeholder-count="6"><a href="{{l.href}}" style="display:flex;align-items:center;height:44px;padding:0 14px;background:#161616;border:1px solid #262626;font:700 13px/1 Manrope,sans-serif;color:#F5F5F5" style-hover="border-color:#C8102E">{{l.label}}</a></sc-for></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['01', 'Brand + Home', 'Home Breakpoints.dc.html', [['Home', 'Home.dc.html'], ['Design system', 'Design System.dc.html']]],
      ['02', 'Public website', 'Phase 2 Pages.dc.html', [['Programs', 'Programs.dc.html'], ['Discipline', 'Discipline.dc.html?d=mma'], ['Schedule', 'Schedule.dc.html'], ['Coaches', 'Coaches.dc.html'], ['Pricing', 'Pricing.dc.html'], ['Gallery', 'Gallery.dc.html'], ['About', 'About.dc.html'], ['Contact', 'Contact.dc.html'], ['FAQs', 'FAQs.dc.html'], ['Blog', 'Blog.dc.html']]],
      ['03', 'Member portal', 'Phase 3 Pages.dc.html', [['Login + onboarding', 'Login.dc.html'], ['Free trial', 'Free Trial.dc.html'], ['Member portal', 'Member Portal.dc.html']]],
      ['04', 'Staff tools', 'Phase 4 Pages.dc.html', [['Admin dashboard', 'Admin.dc.html#dash'], ['Members', 'Admin.dc.html#members'], ['Front-desk check-in', 'Admin.dc.html#checkin'], ['Schedule mgmt', 'Admin.dc.html#schedule'], ['Coupons', 'Admin.dc.html#coupons'], ['Coach app', 'Coach App.dc.html']]],
      ['05', 'Checkout + receipt', 'Phase 5 Pages.dc.html', [['Checkout', 'Checkout.dc.html'], ['Receipt', 'Invoice.dc.html']]]
    ];
    return { phases: P.map(([n, title, canvas, links]) => ({ n, title, canvas, links: links.map(([label, href]) => ({ label, href })) })) };
  }
}
</script>
</body>
</html>
