<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>document.documentElement.setAttribute('data-calm','')</script>
<script src="./dojo-data.js"></script>
<script src="./dojo-admin.js"></script>
<script src="./dojo-motion.js"></script>
<style>body{margin:0;background:#0D0D0D;color:#C9C9C9;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}*{box-sizing:border-box}a{color:#F5F5F5;text-decoration:none}a:hover{color:#FFFFFF}button,input{font-family:inherit}::selection{background:#C8102E;color:#F5F5F5}:focus-visible{outline:2px solid #F5F5F5;outline-offset:3px}input::placeholder{color:#7A7A7A}</style>
</helmet>
<div ref="{{root}}" style="min-height:100vh;display:flex;flex-direction:column">
<header style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:64px;padding:0 clamp(16px,3vw,32px);background:rgba(13,13,13,.95);border-bottom:1px solid #262626;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)">
<sc-if value="{{showBack}}" hint-placeholder-val="{{false}}"><button onClick="{{back}}" aria-label="Back to classes" style="width:44px;height:44px;margin-left:-10px;background:transparent;border:0;color:#F5F5F5;font-size:20px;cursor:pointer">←</button></sc-if>
<span style="font-family:Anton,Impact,sans-serif;font-size:26px;line-height:1;color:#F5F5F5">DOJO<span style="color:#C8102E">X</span></span><span style="font:600 10px/1 'JetBrains Mono',monospace;letter-spacing:.18em;color:#9A9A9A">COACH</span>
<button onClick="{{cycleCoach}}" aria-label="Switch coach" style="margin-left:auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 10px;background:#1A1A1A;border:1px solid #2E2E2E;color:#F5F5F5;cursor:pointer"><span style="font:700 12px/1 Manrope,sans-serif">{{coach.first}}</span><span style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#C8102E;font:800 12px/1 Manrope,sans-serif">{{coach.init}}</span></button>
</header>
<div style="flex:1;width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:{{cols}};gap:clamp(16px,2vw,28px);padding:{{pad}};align-items:start">

<sc-if value="{{showList}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:14px;position:{{listPos}};top:88px">
<div><div style="font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#9A9A9A">THU 15 OCT · {{coach.role}}</div><h1 style="margin:10px 0 0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(44px,8vw,64px);line-height:.9;text-transform:uppercase;color:#F5F5F5">Today<span style="color:#C8102E">.</span></h1></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#262626;border:1px solid #262626"><sc-for list="{{sum}}" as="t" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;gap:6px;padding:14px;background:#161616"><span style="font-family:Anton,Impact,sans-serif;font-size:30px;line-height:1;color:#F5F5F5">{{t.v}}</span><span style="font:600 9px/1.3 'JetBrains Mono',monospace;letter-spacing:.12em;color:#9A9A9A">{{t.k}}</span></div></sc-for></div>
<sc-for list="{{classes}}" as="c" hint-placeholder-count="3"><button onClick="{{c.open}}" aria-current="{{c.cur}}" style="display:flex;align-items:center;gap:14px;padding:16px;background:{{c.bg}};border:1px solid {{c.bd}};border-left:3px solid {{c.color}};color:#F5F5F5;text-align:left;cursor:pointer" style-active="transform:scale(.98)">
<span style="width:70px;display:flex;flex-direction:column;gap:4px"><span style="font:700 15px/1 'JetBrains Mono',monospace">{{c.time}}</span><span style="font:500 10px/1 'JetBrains Mono',monospace;color:#9A9A9A">{{c.dur}} MIN</span></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><span style="font:800 15px/1.2 Manrope,sans-serif">{{c.title}}</span><span style="font:500 12px/1.2 Manrope,sans-serif;color:#9A9A9A">{{c.booked}} booked · {{c.level}}</span></span>
<span style="padding:5px 7px;border:1px solid {{c.sc}};font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:{{c.sc}}">{{c.st}}</span>
</button></sc-for>
<sc-if value="{{noClasses}}" hint-placeholder-val="{{false}}"><div style="padding:24px;border:1px dashed #2E2E2E;font-size:14px;color:#9A9A9A">No classes today. Switch coach to see another schedule.</div></sc-if>
</div>
</sc-if>

<sc-if value="{{showRoster}}" hint-placeholder-val="{{false}}">
<div ref="{{rosterRef}}" style="display:flex;flex-direction:column;gap:14px;min-width:0">
<div style="padding:20px;background:#1A1A1A;border:1px solid #2E2E2E;border-top:4px solid {{cl.color}}">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#9A9A9A"><span>{{cl.disc}} · {{cl.time}}</span><span>{{cl.age}}</span></div>
<div style="margin-top:10px;font-family:Anton,Impact,sans-serif;font-size:clamp(32px,5vw,44px);line-height:1;text-transform:uppercase;color:#F5F5F5">{{cl.title}}</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px"><sc-for list="{{counts}}" as="t" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-family:Anton,Impact,sans-serif;font-size:28px;line-height:1;color:{{t.c}}">{{t.v}}</span><span style="font:600 9px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:#9A9A9A">{{t.k}}</span></div></sc-for></div>
</div>
<sc-if value="{{locked}}" hint-placeholder-val="{{false}}"><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:oklch(0.74 0.15 150 / .12);border:1px solid oklch(0.74 0.15 150 / .5);font:600 14px/1.4 Manrope,sans-serif;color:#F5F5F5"><span style="width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;background:oklch(0.74 0.15 150);color:#0D0D0D;font-weight:900">✓</span><span style="flex:1">Attendance submitted at {{subAt}}. Streaks and belt counts updated.</span><button onClick="{{unlock}}" style="height:40px;padding:0 12px;background:transparent;border:1px solid #2E2E2E;color:#F5F5F5;font:700 12px/1 Manrope,sans-serif;cursor:pointer">Edit</button></div></sc-if>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
<input value="{{q}}" onInput="{{setQ}}" placeholder="Find in roster" aria-label="Find in roster" style="flex:1 1 180px;height:48px;padding:0 14px;background:#141414;border:1px solid #2E2E2E;color:#F5F5F5;font:600 15px/1 Manrope,sans-serif;outline:none">
<button onClick="{{allIn}}" disabled="{{locked}}" style="height:48px;padding:0 14px;background:transparent;border:1px solid #2E2E2E;color:#F5F5F5;font:700 12px/1 Manrope,sans-serif;cursor:pointer;opacity:{{lockOp}}">Mark rest present</button>
</div>
<div style="display:flex;flex-direction:column;gap:1px;background:#262626;border:1px solid #262626">
<sc-for list="{{roster}}" as="r" hint-placeholder-count="8">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 14px;background:{{r.bg}}">
<span style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;background:{{r.avBg}};color:{{r.avFg}};font:800 14px/1 Manrope,sans-serif;transition:background .15s">{{r.init}}</span>
<span style="flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font:800 15px/1.2 Manrope,sans-serif;color:#F5F5F5">{{r.name}}</span><span style="font:500 11px/1.3 'JetBrains Mono',monospace;color:{{r.noteC}}">{{r.note}}</span></span>
<span role="radiogroup" aria-label="Attendance for {{r.name}}" style="display:grid;grid-template-columns:repeat(3,52px);gap:4px;opacity:{{lockOp}}"><sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" role="radio" aria-checked="{{o.on}}" aria-label="{{o.aria}}" disabled="{{o.dis}}" style="height:48px;background:{{o.bg}};border:1px solid {{o.bd}};color:{{o.fg}};font:800 13px/1 'JetBrains Mono',monospace;cursor:pointer;transition:background .12s" style-active="transform:scale(.92)">{{o.label}}</button></sc-for></span>
</div>
</sc-for>
</div>
<form onSubmit="{{addWalk}}" style="display:flex;gap:0;border:1px dashed #2E2E2E"><input value="{{walk}}" onInput="{{setWalk}}" placeholder="Add walk-in or trial by name" aria-label="Walk-in name" style="flex:1;min-width:0;height:52px;padding:0 14px;background:transparent;border:0;color:#F5F5F5;font:600 15px/1 Manrope,sans-serif;outline:none"><button type="submit" style="padding:0 18px;background:transparent;border:0;border-left:1px dashed #2E2E2E;color:#F5F5F5;font:800 12px/1 Manrope,sans-serif;letter-spacing:.08em;cursor:pointer">+ ADD</button></form>
<label style="display:flex;flex-direction:column;gap:8px"><span style="font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:.18em;color:#9A9A9A">CLASS NOTE · VISIBLE TO OWNER</span><input value="{{note}}" onInput="{{setNote}}" placeholder="e.g. Worked teep counters, Riya ready for sparring" style="height:52px;padding:0 14px;background:#141414;border:1px solid #2E2E2E;color:#F5F5F5;font:600 14px/1 Manrope,sans-serif;outline:none"></label>
</div>
</sc-if>
</div>

<sc-if value="{{showSubmit}}" hint-placeholder-val="{{false}}">
<div style="position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px) calc(12px + env(safe-area-inset-bottom));background:rgba(13,13,13,.96);border-top:1px solid #262626;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)">
<span style="flex:1;min-width:0;font:600 13px/1.3 Manrope,sans-serif;color:#C9C9C9">{{subText}}</span>
<button onClick="{{submit}}" disabled="{{cantSubmit}}" style="height:54px;padding:0 22px;border:0;background:{{subBg}};color:#F5F5F5;font:800 13px/1 Manrope,sans-serif;letter-spacing:.1em;cursor:pointer;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)" style-active="transform:scale(.96)">SUBMIT</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: window.innerWidth, ok: false, coach: 'kavya', open: null, att: {}, walk: '', walks: {}, done: {}, q: '', note: '' };
  root = React.createRef(); rosterRef = React.createRef();
  componentDidMount() { this._rs = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this._rs); const t = () => window.DXA && window.DOJO && window.DojoMotion ? this.setState({ ok: true, coach: (() => { const c = {}; DOJO.classes.filter(x => x.d === 3).forEach(x => c[x.coach] = (c[x.coach] || 0) + 1); return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || 'kavya'; })() }, () => DojoMotion.init(this.root.current)) : setTimeout(t, 30); t(); }
  componentWillUnmount() { window.removeEventListener('resize', this._rs); }
  componentDidUpdate(pp, ps) { ps = ps || {}; const M = window.DojoMotion; if (M && ps.open !== this.state.open && this.state.open && this.rosterRef.current && !M.reduced()) this.rosterRef.current.animate([{ opacity: 0, transform: 'translateX(20px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' }); }
  roster(c) {
    const A = window.DXA; let seed = c.id * 7; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const pool = A.members.filter(m => (c.age === 'Kids') === !!m.kid);
    const list = []; const n = Math.min(c.booked, 14);
    for (let i = 0; i < n; i++) { const m = pool[Math.floor(r() * pool.length)] || A.members[i]; if (!list.some(x => x.id === m.id)) list.push({ id: m.id, name: m.name, status: m.status, streak: Math.floor(r() * 14), first: r() < .12 }); }
    return list.concat((this.state.walks[c.id] || []).map((name, i) => ({ id: 'w' + i, name, walk: true })));
  }
  renderVals() {
    const D = window.DOJO, s = this.state, desk = s.w >= 900;
    const base = { root: this.root, rosterRef: this.rosterRef, showList: true, coach: { first: '', init: '' }, classes: [], cols: 'minmax(0,1fr)' };
    if (!s.ok) return base;
    const C = D.coaches[s.coach];
    const mine = D.classes.filter(c => c.d === 3 && c.coach === s.coach).sort((a, b) => a.t.localeCompare(b.t));
    const nowT = '18:20';
    const end = c => { let [h, m] = c.t.split(':').map(Number); const t = h * 60 + m + c.dur; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
    const stOf = c => s.done[c.id] ? ['SUBMITTED', 'oklch(0.78 0.14 150)'] : c.t <= nowT && end(c) > nowT ? ['LIVE NOW', '#C8102E'] : end(c) <= nowT ? ['MARK NOW', 'oklch(0.82 0.14 75)'] : ['UPCOMING', '#9A9A9A'];
    const openId = s.open || (desk && mine[0] ? (mine.find(c => stOf(c)[0] === 'LIVE NOW') || mine[0]).id : null);
    const cl = openId ? D.classes.find(c => c.id === openId) : null;
    const att = (cl && s.att[cl.id]) || {};
    const ros = cl ? this.roster(cl) : [];
    const locked = cl && !!s.done[cl.id];
    const setAtt = (rid, v) => this.setState(x => ({ att: { ...x.att, [cl.id]: { ...(x.att[cl.id] || {}), [rid]: v } } }));
    const cnt = k => ros.filter(r => att[r.id] === k).length;
    const marked = ros.filter(r => att[r.id]).length;
    const q = s.q.trim().toLowerCase();
    const showRoster = !!cl, showList = desk || !cl;
    return Object.assign(base, {
      coach: { first: C.first, init: C.first[0] + C.last[0], role: C.role.toUpperCase() },
      cycleCoach: () => { const o = ['kavya', 'arjun', 'meera', 'rahul', 'ananya']; this.setState({ coach: o[(o.indexOf(s.coach) + 1) % o.length], open: null, q: '' }); },
      cols: desk ? '360px minmax(0,1fr)' : 'minmax(0,1fr)', pad: desk ? '32px clamp(24px,3vw,32px) 120px' : '20px 16px 120px', listPos: desk ? 'sticky' : 'static',
      showList, showRoster, showBack: !desk && !!cl, back: () => this.setState({ open: null, q: '' }),
      sum: [{ k: 'CLASSES', v: mine.length }, { k: 'BOOKED', v: mine.reduce((a, c) => a + c.booked, 0) }, { k: 'SUBMITTED', v: mine.filter(c => s.done[c.id]).length + '/' + mine.length }],
      classes: mine.map(c => { const [st, sc] = stOf(c), on = cl && cl.id === c.id; return { time: D.time12(c.t), dur: c.dur, title: c.title, booked: c.booked, level: c.level, color: D.color(c.disc), st, sc, cur: on ? 'true' : 'false', bg: on ? '#1A1A1A' : '#161616', bd: on ? '#C8102E' : '#262626', open: () => this.setState({ open: c.id, q: '' }) }; }), noClasses: !mine.length,
      cl: cl ? { title: cl.title, disc: D.disciplines[cl.disc].name.toUpperCase(), time: D.time12(cl.t) + ' – ' + D.time12(end(cl)), age: cl.age.toUpperCase(), color: D.color(cl.disc) } : {},
      counts: [{ k: 'PRESENT', v: cnt('p'), c: 'oklch(0.78 0.14 150)' }, { k: 'LATE', v: cnt('l'), c: 'oklch(0.82 0.14 75)' }, { k: 'ABSENT', v: cnt('a'), c: 'oklch(0.75 0.17 35)' }, { k: 'UNMARKED', v: ros.length - marked, c: '#F5F5F5' }],
      locked, lockOp: locked ? .5 : 1, subAt: '7:42 PM', unlock: () => this.setState(x => ({ done: { ...x.done, [cl.id]: false } })),
      q: s.q, setQ: e => this.setState({ q: e.target.value }),
      allIn: () => { const o = { ...att }; ros.forEach(r => { if (!o[r.id]) o[r.id] = 'p'; }); this.setState(x => ({ att: { ...x.att, [cl.id]: o } })); },
      roster: ros.filter(r => !q || r.name.toLowerCase().includes(q)).map(r => { const v = att[r.id]; const AC = { p: 'oklch(0.74 0.15 150)', l: 'oklch(0.82 0.14 75)', a: 'oklch(0.70 0.19 35)' };
        const note = r.walk ? 'WALK-IN · ADD TO TRIALS' : r.first ? 'FIRST CLASS · SAY HELLO' : r.status === 'lapsed' ? 'PLAN LAPSED · SEND TO DESK' : r.status === 'expiring' ? 'RENEWAL DUE THIS WEEK' : r.streak >= 7 ? `${r.streak}-CLASS STREAK` : r.id;
        return { name: r.name, init: r.name.split(' ').map(x => x[0]).join('').slice(0, 2), note, noteC: r.status === 'lapsed' ? 'oklch(0.80 0.14 45)' : r.first || r.walk ? 'oklch(0.82 0.14 75)' : '#9A9A9A', bg: v ? '#1A1A1A' : '#161616', avBg: v ? AC[v] : '#262626', avFg: v ? '#0D0D0D' : '#F5F5F5',
          opts: [['p', 'P', 'Present'], ['l', 'L', 'Late'], ['a', 'A', 'Absent']].map(([k, label, aria]) => ({ label, aria, on: v === k, dis: locked, bg: v === k ? AC[k] : 'transparent', bd: v === k ? AC[k] : '#2E2E2E', fg: v === k ? '#0D0D0D' : '#C9C9C9', pick: () => !locked && setAtt(r.id, v === k ? null : k) })) }; }),
      walk: s.walk, setWalk: e => this.setState({ walk: e.target.value }),
      addWalk: e => { e.preventDefault(); const n = s.walk.trim(); if (!n || !cl) return; this.setState(x => ({ walks: { ...x.walks, [cl.id]: [...(x.walks[cl.id] || []), n] }, walk: '', att: { ...x.att, [cl.id]: { ...(x.att[cl.id] || {}), ['w' + (x.walks[cl.id] || []).length]: 'p' } } })); DojoMotion.toast(n + ' added and marked present'); },
      note: s.note, setNote: e => this.setState({ note: e.target.value }),
      showSubmit: !!cl && !locked, cantSubmit: marked < ros.length, subBg: marked < ros.length ? '#333333' : '#C8102E',
      subText: marked < ros.length ? `${ros.length - marked} still unmarked` : `${cnt('p') + cnt('l')} of ${ros.length} attended`,
      submit: () => { if (marked < ros.length) return; this.setState(x => ({ done: { ...x.done, [cl.id]: true } })); DojoMotion.toast('Attendance submitted. Members’ streaks updated.'); }
    });
  }
}
</script>
</body>
</html>
