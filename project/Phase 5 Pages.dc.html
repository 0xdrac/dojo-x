<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
body{margin:0;background:#E9E7E3;font-family:system-ui,sans-serif}
a{color:#1a1a1a}
a:hover{color:#C8102E}
</style>
</helmet>
<section id="t5" style="padding:40px 44px 32px">
<div style="display:flex;align-items:baseline;gap:10px;margin:0 0 8px"><a href="#t5" style="font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none">5</a><span style="font:600 13px/1.2 system-ui,sans-serif;color:#1a1a1a">Phase 5 · Checkout, Razorpay states and receipt at mobile (375) and desktop (1440).</span></div>
<p style="margin:0 0 28px;font:12px/1.5 system-ui,sans-serif;color:rgba(0,0,0,.55)">Tap Pay to open the Razorpay popup placeholder, then simulate Success / Failed / Pending. Pricing → Checkout and Member Portal → Renew both land here.</p>
<sc-for list="{{pages}}" as="p" hint-placeholder-count="12">
<div id="{{p.id}}" style="margin:0 0 48px">
<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px;font:400 12px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.6)"><a href="#{{p.id}}" style="font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none">{{p.id}}</a><b style="color:#1a1a1a">{{p.name}}</b> · {{p.note}} · <a href="{{p.src}}">open ↗</a></div>
<div style="display:flex;gap:28px;align-items:flex-start">
<div style="flex:none;width:375px;height:780px;border:8px solid #1a1a1a;border-radius:32px;overflow:hidden;background:#0D0D0D;box-sizing:content-box"><iframe src="{{p.src}}" title="{{p.name}} mobile" loading="lazy" style="width:375px;height:780px;border:0;display:block"></iframe></div>
<div style="flex:none;width:1440px;height:900px;border:1px solid rgba(0,0,0,.15);border-radius:8px;overflow:hidden;background:#0D0D0D"><iframe src="{{p.src}}" title="{{p.name}} desktop" loading="lazy" style="width:1440px;height:900px;border:0;display:block"></iframe></div>
</div>
</div>
</sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['Checkout · from Pricing', 'Checkout.dc.html?d=mma,muaythai&dur=half&p=1&mode=auto', 'details, auto vs once, coupon, Razorpay popup'],
      ['Checkout · renewal (family)', 'Checkout.dc.html?src=portal&d=karate&dur=quarterly&p=2&mode=manual&c=DOJOX10', 'prefilled, 10% + coupon'],
      ['Receipt', 'Invoice.dc.html?d=mma,muaythai&dur=half&p=1&c=FIGHTNIGHT15', 'discounts, amount in words, print to PDF']
    ];
    return { pages: P.map(([name, src, note], i) => ({ id: `5${'abcdefghijklmn'[i]}`, name, src, note })) };
  }
}
</script>
</body>
</html>
