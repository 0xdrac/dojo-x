<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{root}}">
<header style="position:fixed;top:0;left:0;right:0;z-index:50;background:{{hdrBg}};border-bottom:1px solid {{hdrBd}};backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .25s,border-color .25s">
<div style="max-width:1440px;margin:0 auto;height:{{hdrH}};padding:0 clamp(16px,4vw,56px);display:flex;align-items:center;gap:28px">
<a href="Home.dc.html" aria-label="Dojo X, home" style="display:flex;align-items:center;gap:10px;flex:none;min-height:44px">
<span style="width:12px;height:28px;background:#C8102E;transform:skewX(-18deg)"></span>
<span style="display:flex;flex-direction:column;gap:4px"><span style="font-family:Anton,Impact,sans-serif;font-size:24px;line-height:1;letter-spacing:.06em;color:#F5F5F5">DOJO X</span><span style="font:500 8.5px/1 'JetBrains Mono',monospace;letter-spacing:.34em;color:#9A9A9A">FIGHT ACADEMY</span></span>
</a>
<sc-if value="{{desk}}" hint-placeholder-val="{{true}}">
<nav aria-label="Main" style="display:flex;gap:26px;margin-left:auto">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<a href="{{n.href}}" aria-current="{{n.cur}}" style="--h:{{n.h}};position:relative;font:700 12px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:{{n.fg}};padding:10px 0;transition:color .2s" style-hover="--h:1;color:#F5F5F5">{{n.label}}<span style="position:absolute;left:0;right:0;bottom:2px;height:2px;background:#C8102E;transform-origin:left;transform:scaleX(var(--h)) skewX(-40deg);transition:transform .25s cubic-bezier(.7,0,.2,1)"></span></a>
</sc-for>
</nav>
<a href="Login.dc.html" style="font:700 12px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#F5F5F5;padding:14px 4px;border-bottom:1px solid #2E2E2E">Member Login</a>
<a href="Schedule.dc.html" style="--h:0;position:relative;display:inline-flex;flex:none;transition:transform .2s cubic-bezier(.7,0,.2,1),filter .25s" style-hover="--h:1;transform:translateY(-2px);filter:drop-shadow(0 8px 18px rgba(200,16,46,.45))" style-active="transform:scale(.96)"><span style="position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;background:#C8102E;color:#F5F5F5;font:800 12px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)"><span style="position:absolute;top:0;bottom:0;left:-20%;width:140%;background:#8E0B20;transform:translateX(calc((var(--h) - 1) * 105%)) skewX(-24deg);transition:transform .35s cubic-bezier(.7,0,.2,1)"></span><span data-shine-bar="" style="position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-150%) skewX(-20deg)"></span><span style="position:relative">Free Trial</span><span style="position:relative;transform:translateX(calc(var(--h) * 5px));transition:transform .25s cubic-bezier(.7,0,.2,1)">→</span></span></a>
</sc-if>
<sc-if value="{{notDesk}}" hint-placeholder-val="{{false}}">
<div style="margin-left:auto;display:flex;align-items:center;gap:8px">
<a href="Schedule.dc.html" style="display:inline-flex;align-items:center;height:44px;padding:0 14px;background:#C8102E;color:#F5F5F5;font:800 11px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)" style-active="transform:scale(.96)">Free Trial</a>
<button onClick="{{toggleMenu}}" aria-label="{{menuLabel}}" aria-expanded="{{menu}}" style="width:44px;height:44px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px;background:transparent;border:1px solid #2E2E2E;padding:0 11px;cursor:pointer">
<span style="display:block;width:20px;height:2px;background:#F5F5F5;transition:transform .25s cubic-bezier(.7,0,.2,1);transform:{{bar1T}}"></span>
<span style="display:block;width:{{bar2W}};height:2px;background:#C8102E;transition:transform .25s cubic-bezier(.7,0,.2,1),width .25s;transform:{{bar2T}}"></span>
</button>
</div>
</sc-if>
</div>
</header>
<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div data-menu-panel="" style="position:fixed;inset:0;z-index:45;background:#0D0D0D;padding:96px 20px 28px;display:flex;flex-direction:column;overflow-y:auto">
<div style="position:absolute;top:0;bottom:0;right:-30%;width:60%;background:#C8102E;opacity:.1;transform:skewX(-18deg);pointer-events:none"></div>
<nav aria-label="Mobile" style="position:relative;display:flex;flex-direction:column">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<a data-menu-item="" href="{{n.href}}" style="display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid #1A1A1A"><span style="font:500 11px/1 'JetBrains Mono',monospace;color:{{n.numFg}}">{{n.num}}</span><span style="font-family:Anton,Impact,sans-serif;font-size:clamp(44px,12vw,72px);line-height:1;color:{{n.bigFg}};text-transform:uppercase">{{n.label}}</span></a>
</sc-for>
</nav>
<div data-menu-item="" style="position:relative;margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:12px">
<a href="Schedule.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;background:#C8102E;color:#F5F5F5;font:800 14px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)" style-active="transform:scale(.96)">Book Free Trial →</a>
<a href="Login.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border:1px solid #2E2E2E;color:#F5F5F5;font:700 14px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase">Member Login</a>
<div style="display:flex;justify-content:space-between;font:500 12px/1.4 'JetBrains Mono',monospace;color:#9A9A9A;padding-top:8px"><span>+91 98450 21734</span><span>Vasundhara, GZB</span></div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;programs&quot;,&quot;schedule&quot;,&quot;coaches&quot;,&quot;pricing&quot;,&quot;gallery&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, scrolled: window.scrollY > 40, menu: false };
  root = React.createRef();
  componentDidMount() {
    this._rs = () => this.setState({ w: window.innerWidth });
    this._sc = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    window.addEventListener('resize', this._rs); window.addEventListener('scroll', this._sc, { passive: true });
    if (window.DojoReady) DojoReady(() => DojoMotion.observe(this.root.current));
  }
  componentWillUnmount() { window.removeEventListener('resize', this._rs); window.removeEventListener('scroll', this._sc); document.body.style.overflow = ''; }
  componentDidUpdate(pp, ps) {
    const r = this.root.current;
    if (this.state.menu && !ps.menu && r && !(window.DojoMotion && DojoMotion.reduced())) {
      const p = r.querySelector('[data-menu-panel]');
      p && p.animate([{ clipPath: 'polygon(0 0,0 0,-30% 100%,-30% 100%)' }, { clipPath: 'polygon(0 0,130% 0,100% 100%,-30% 100%)' }], { duration: 380, easing: 'cubic-bezier(.7,0,.2,1)' });
      r.querySelectorAll('[data-menu-item]').forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateX(-80px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 90 + i * 45, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
    }
  }
  toggleMenu = () => { const m = !this.state.menu; document.body.style.overflow = m ? 'hidden' : ''; this.setState({ menu: m }); };
  renderVals() {
    const { w, scrolled, menu } = this.state, desk = w >= 1180, act = this.props.active || '';
    const items = [['programs', 'Programs', 'Programs.dc.html'], ['schedule', 'Schedule', 'Schedule.dc.html'], ['coaches', 'Coaches', 'Coaches.dc.html'], ['pricing', 'Pricing', 'Pricing.dc.html'], ['gallery', 'Gallery', 'Gallery.dc.html'], ['about', 'About', 'About.dc.html'], ['contact', 'Contact', 'Contact.dc.html']];
    return {
      root: this.root, desk, notDesk: !desk, menu, toggleMenu: this.toggleMenu, menuLabel: menu ? 'Close menu' : 'Open menu',
      hdrH: desk ? '76px' : '64px',
      hdrBg: scrolled || menu ? 'rgba(13,13,13,.9)' : 'rgba(13,13,13,0)',
      hdrBd: scrolled && !menu ? '#262626' : 'rgba(38,38,38,0)',
      bar1T: menu ? 'translateY(4.5px) rotate(45deg)' : 'none', bar2T: menu ? 'translateY(-4.5px) rotate(-45deg)' : 'none', bar2W: menu ? '20px' : '13px',
      nav: items.map(([k, label, href], i) => ({ label, href, h: act === k ? 1 : 0, fg: act === k ? '#F5F5F5' : '#C9C9C9', cur: act === k ? 'page' : undefined, num: String(i + 1).padStart(2, '0'), numFg: act === k ? '#C8102E' : '#9A9A9A', bigFg: act === k ? '#C8102E' : '#F5F5F5' }))
    };
  }
}
</script>
</body>
</html>
