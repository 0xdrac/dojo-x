<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<script src="./dojo-data.js"></script>
<script src="./dojo-posts.js"></script>
<script src="./dojo-motion.js"></script>
<style>html{scroll-behavior:auto}body{margin:0;background:#0D0D0D;color:#C9C9C9;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}*{box-sizing:border-box}a{color:#F5F5F5;text-decoration:none}a:hover{color:#FFFFFF}button,input,select,textarea{font-family:inherit}::selection{background:#C8102E;color:#F5F5F5}:focus-visible{outline:2px solid #F5F5F5;outline-offset:3px}body.kc-cursor,body.kc-cursor *{cursor:none !important}</style>
</helmet>
<div ref="{{root}}" style="position:relative;overflow-x:clip">
<dc-import name="SiteHeader" active="" hint-size="100%,0px"></dc-import>

<section data-screen-label="Blog hero" style="position:relative;padding:clamp(110px,12vw,150px) clamp(16px,4vw,56px) clamp(24px,3vw,32px)">
<div style="max-width:1328px;margin:0 auto">
<div data-hero-fade="" style="display:flex;align-items:center;gap:10px;margin-bottom:18px;font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#9A9A9A"><span>HOME</span><span style="color:#C8102E">/</span><span style="color:#F5F5F5">BLOG</span></div>
<h1 data-shake="" style="margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(56px,9vw,140px);line-height:.86;text-transform:uppercase;color:#F5F5F5"><span data-slam="" style="display:inline-block">Corner</span> <span data-slam="" style="display:inline-block;color:transparent;-webkit-text-stroke:2px #F5F5F5">notes</span><span data-slam="" style="display:inline-block;color:#C8102E">.</span></h1>
<p data-hero-fade="" style="margin:18px 0 0;max-width:520px;font-size:17px;line-height:1.6;color:#C9C9C9">Technique, training and food advice from the people who coach you.</p>
</div>
</section>

<section data-screen-label="Blog listing" style="padding:0 clamp(16px,4vw,56px) clamp(72px,9vw,120px)">
<div style="max-width:1328px;margin:0 auto">
<a href="{{f.href}}" data-reveal="" style="--h:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0;background:#161616;border:1px solid #262626;transition:border-color .2s" style-hover="--h:1;border-color:#C8102E">
<span style="position:relative;min-height:300px;overflow:hidden;color:#9A9A9A;background:repeating-linear-gradient(135deg,#191919 0 12px,#151515 12px 24px)"><span style="position:absolute;inset:0;filter:grayscale(calc(1 - var(--h))) contrast(1.2);transform:scale(calc(1 + var(--h) * .05));transition:transform .45s cubic-bezier(.7,0,.2,1),filter .4s"><image-slot id="{{f.slot}}" shape="rect" placeholder="{{f.ph}}"></image-slot></span><span style="position:absolute;top:0;left:0;padding:8px 12px;background:#C8102E;font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#F5F5F5;pointer-events:none">FEATURED</span></span>
<span style="padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:14px">
<span style="display:flex;align-items:center;gap:8px;font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#C9C9C9"><span style="width:7px;height:7px;background:{{f.color}}"></span>{{f.catU}} · {{f.readU}}</span>
<span style="font-family:Anton,Impact,sans-serif;font-size:clamp(36px,4vw,60px);line-height:.95;color:#F5F5F5;text-transform:uppercase">{{f.title}}</span>
<span style="font-size:16px;line-height:1.6;color:#C9C9C9">{{f.dek}}</span>
<span style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid #262626;font:500 12px/1 'JetBrains Mono',monospace;color:#9A9A9A"><span>{{f.authorU}} · {{f.dateU}}</span><span style="color:#F5F5F5;transform:translateX(calc(var(--h) * 6px));transition:transform .25s cubic-bezier(.7,0,.2,1)">READ →</span></span>
</span>
</a>
<div role="group" aria-label="Category" style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:clamp(32px,4vw,48px) 0 20px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="7"><button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex:none;height:40px;padding:0 14px;background:{{c.bg}};border:1px solid {{c.bd}};color:{{c.fg}};font:700 12px/1 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer" style-active="transform:scale(.96)">{{c.label}}</button></sc-for>
</div>
<div ref="{{gridRef}}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(14px,2vw,22px)">
<sc-for list="{{posts}}" as="p" hint-placeholder-count="6">
<a href="{{p.href}}" data-post="" style="--h:0;display:flex;flex-direction:column;background:#161616;border:1px solid #262626;transition:border-color .2s;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)" style-hover="--h:1;border-color:#9A9A9A">
<span style="position:relative;aspect-ratio:16/10;overflow:hidden;color:#9A9A9A;background:repeating-linear-gradient(135deg,#191919 0 12px,#151515 12px 24px)"><span style="position:absolute;inset:0;filter:grayscale(calc(1 - var(--h))) contrast(1.2);transform:scale(calc(1 + var(--h) * .05));transition:transform .45s cubic-bezier(.7,0,.2,1),filter .4s"><image-slot id="{{p.slot}}" shape="rect" placeholder="{{p.ph}}"></image-slot></span></span>
<span style="padding:18px 18px 24px;display:flex;flex-direction:column;gap:10px;flex:1">
<span style="display:flex;align-items:center;gap:8px;font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#C9C9C9"><span style="width:6px;height:6px;background:{{p.color}}"></span>{{p.catU}} · {{p.readU}}</span>
<span style="font-family:Anton,Impact,sans-serif;font-size:28px;line-height:1;color:#F5F5F5;text-transform:uppercase">{{p.title}}</span>
<span style="font-size:14px;line-height:1.55;color:#9A9A9A">{{p.dek}}</span>
<span style="margin-top:auto;padding-top:12px;font:500 11px/1 'JetBrains Mono',monospace;color:#9A9A9A">{{p.authorU}} · {{p.dateU}}</span>
</span>
</a>
</sc-for>
</div>
</div>
</section>

<dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'All', ready: !!window.DOJO_POSTS };
  root = React.createRef(); gridRef = React.createRef();
  componentDidMount() { DojoReady(() => { const t = () => window.DOJO_POSTS ? this.setState({ ready: true }, () => DojoMotion.init(this.root.current)) : setTimeout(t, 30); t(); }); }
  componentDidUpdate(pp, ps) { if (ps.cat !== this.state.cat && this.gridRef.current) DojoMotion.stagger(this.gridRef.current.children); }
  renderVals() {
    const P = window.DOJO_POSTS, D = window.DOJO, cat = this.state.cat;
    if (!P || !D) return { root: this.root, gridRef: this.gridRef, f: {}, posts: [], chips: [] };
    const map = p => ({ href: `Article.dc.html?p=${p.slug}`, slot: `post-${p.slug}`, ph: `COVER · ${p.title}`, color: D.color(p.disc), catU: p.cat.toUpperCase(), readU: `${p.read.toUpperCase()} READ`, title: p.title, dek: p.dek, authorU: p.author.toUpperCase(), dateU: p.date.toUpperCase() });
    const rest = P.slice(1).filter(p => cat === 'All' || p.cat === cat);
    const cats = ['All'].concat([...new Set(P.slice(1).map(p => p.cat))]);
    return {
      root: this.root, gridRef: this.gridRef, f: map(P[0]), posts: rest.map(map),
      chips: cats.map(c => ({ label: c, on: cat === c, bg: cat === c ? 'rgba(200,16,46,.16)' : '#161616', bd: cat === c ? '#C8102E' : '#2E2E2E', fg: cat === c ? '#F5F5F5' : '#C9C9C9', pick: () => this.setState({ cat: c }) }))
    };
  }
}
</script>
</body>
</html>
